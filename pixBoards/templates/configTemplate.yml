# pixBoards config. Paths may use ~ and $VARIABLES.
# This file is the same as config_example.yml in the repository.

# Output goes to <dirname(masterDir)>/<name>; with --config the name is the
# config file's name, with --upload "_upload" is appended.
masterDir: "~/pixboards/boards"

directories:
  - "~/Pictures"

# image lists (one link per line), used with --useLists
imageLists:
  - imageLists/loremPicsum.txt

# layout
default_layout: masonry   # masonry or justified
col_count: 5              # masonry columns
row_height: 240           # justified row height in px
margin: 20

# pages
paginate: True
page_size: 50
padding: 3                # digits in page file names; don't change unless you know why
lazy_loading: True
source_links: False       # start with "open on Pinterest" links shown (toggle on the page)

# other
json_dump: False          # write dump.json (board -> files and links) into the output folder
# cache_file: ~/.cache/pixboards/media.sqlite3   # hashes, image sizes, timestamps

# --gitPush (token from GITHUB_PAT in the environment or .env)
# remote_url: https://github.com/you/your-boards.git
# gitUsername: you

# imgchest accounts to upload with, in order (one key each: IMG_CHEST_API_KEY_<NAME> in .env;
# default: every account, IMG_CHEST_API_KEY first; full ones are skipped). --account overrides it.
# imgchest_accounts: [main, alt]

# postgres (for --upload and --saveBoards)
host: localhost
server_port: 5432
user: postgres
password: password
dbname: boards
tableName: image_cache
