name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04 still provides 3.10 (the oldest supported version)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[upload,test]" ruff
      - name: Lint
        run: |
          ruff check pixBoards tests scripts
          ruff format --check pixBoards tests scripts
      - name: Test
        run: pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
