name: Upload Python Package

# Runs when a GitHub release is published.
# Uses PyPI trusted publishing: add this repository as a trusted publisher on
# https://pypi.org/manage/project/pixboards/settings/publishing/
# (workflow: publish.yml, environment: pypi). No API token is stored.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[upload,test]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
